<style>

tiveness|Precisión De Inventario|Precisión De Picking|Productividad De Picking|Productividad De Picking (Cjs/Hr)|Productividad De Reempaque|Productividad De Selección|Rendimiento de Neumáticos|Rescate En Ruta|Rotación|Rotura de Botellas|Shipping Age|TR Effectiveness|Utilización De Almacén|Warehouse Utilization (%)|WNP Directo|Adherencia Al Retorno De Envase|Adherencia Al Plan De Viajes T1|Adherencia Al Simulador De Recursos Wh|Costo Total Rotura|GOP|In Trade Losses|MBFU (%)|Productividad De Vertido|Roturas En Almacén|Cashless|Asistencia|Fuera de Stock|Capex|Sobre Stock|Driver Click Score|Hardware Trace|Cambio de Frecuencia|DPO Medios|LTIs|TRIs|TQI|Productividad Total|Eficiencia de Activos|Ocupación de Activos|Utilización de Activos|Costo por caso|Nps Delivery|Órdenes Modificadas|General SPO|Acompañamiento SPO|Auditorías SPO|Refugo en Ruta|Cobertura Vacantes|Rotación de nuevos contratados|Inducción a la incorporación|Plan Padrino|3R|Plan De Comunicación|Vacaciones|Compensación Variable|SKAP|Buzón de Sugerencias|Servicios Generales|Caminatas Gemba|Toolkit de autonomía|Feedback de Conductores|TSO|RTM|SCOH|Paradas No Plan|Adherencia Atención T1|Adherencia Dimensionamiento|Adherencia Layout|Asset Efficiency|Ausentismo Injustificado|Capacity Occupation|Clientes por Ruta|DE|Descanso Efectivo|Disponibilidad Flota|Disponibilidad FLTs|Disponibilidad Montacarga|Eficiencia en cargues|Errores de Alistamiento|Evaluados Totales/P.Críticos/Visitas|Horas en Taller FLT|LTI|LTI/TRI|OTIF|Pedidos Rechazados|Pernoctas TAT|Productividad de Sorting|Rechazo|Stock Out/TSO|TAT Segundos Cargues|TRI|TurnOver|VLC|Check List Salida/Check List Retorno|Clientes Cashless aceptados en efectivo|HTD|Marcaciones conductor +JL|Vehículos en Taller|Descargue de VH antes 22:00|Errores de Verificación|PNP|SAC|Tiempo de Reabastecimiento|Total Productivity`.split('|').map(k=>[k.toLowerCase(),k])).values()].sort((a,b)=>a.localeCompare(b,'es'));

const $=s=>document.querySelector(s), app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const LS={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ---------- datos ---------- */
let records=[], personas=[], db=null;
const NUBE=!!FIREBASE_CONFIG.projectId;
const Store={
  init(){
    if(NUBE){
      firebase.initializeApp(FIREBASE_CONFIG);db=firebase.firestore();
      db.collection('herramientas').onSnapshot(s=>{records=s.docs.map(d=>d.data());if(view!=='editor')render()},e=>toast('Error de conexión: '+e.message));
      db.collection('personas').onSnapshot(s=>{personas=s.docs.map(d=>d.data().nombre).sort()});
    }else{records=LS.get('hg_records',[]);personas=LS.get('hg_personas',[])}
  },
  async save(r){if(NUBE)await db.collection('herramientas').doc(r.id).set(JSON.parse(JSON.stringify(r)));else{const i=records.findIndex(x=>x.id===r.id);i<0?records.push(r):records[i]=r;LS.set('hg_records',records)}},
  async del(id){if(NUBE)await db.collection('herramientas').doc(id).delete();else{records=records.filter(x=>x.id!==id);LS.set('hg_records',records)}},

 [/\d{1,2}[\/\-]\d{1,2}|semana|enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|octubre|noviembre|diciembre|ayer|hoy|turno|del d[ií]a|del \d/i.test(t),'Di cuándo ocurrió (fecha, semana o turno)'],
 [/\bvs\b|meta|objetivo|target|frente a|est[aá]ndar|l[ií]mite/i.test(t),'Compara contra la meta o el estándar (ej. "4,2% vs meta 2,5%")'],
 [!!t&&!/falta de|por culpa|descuido|porque|debido a/i.test(t),'Describe el síntoma, no la causa ni el culpable (evita "falta de", "porque", "por culpa")']]}
function chkWhy(c){const w=c.w.map(x=>x.trim()),out=[],n=w.filter(Boolean).length,all=[...w,c.raiz].join(' ');
  if(w.some((x,i)=>x&&w.slice(0,i).some(y=>!y)))out.push('Hay un porqué vacío en medio de la cadena: cada respuesta debe salir de la anterior.');
  if(w.some((x,i)=>x&&w.indexOf(x)!==i))out.push('Dos porqués dicen lo mismo: avanza un nivel más profundo.');
  if(/descuido|error humano|no quiso|culpa|irresponsab|pereza|falta de compromiso|no le import|se le olvid/i.test(all))out.push('Evita culpar a la persona. Pregunta: ¿qué del proceso, el estándar o el entrenamiento permitió que pasara?');
  if(/^\s*falta de|no hay /i.test(c.raiz))out.push('"Falta de…" suele ser una solución disfrazada. Pregunta una vez más: ¿por qué falta?');
  if(/clima|lluvia|tr[aá]fico|tranc[oó]n|orden p[uú]blico/i.test(c.raiz))out.push('La causa raíz parece estar fuera de tu control. Sigue hasta algo que el CD sí pueda cambiar.');
  if(c.raiz.trim()&&n<3)out.push('Con menos de 3 porqués normalmente se llega al síntoma, no a la causa raíz.');
  return out}
function lectura(c,prob){const w=c.w.filter(x=>x.trim());if(w.length<2)return'';const ch=[...w].reverse();return (c.raiz?esc(c.raiz)+' → por lo tanto → ':'')+ch.map(esc).join(' → por lo tanto → ')+(prob?' → por lo tanto → <b>'+esc(prob.slice(0,90))+'</b>':'')}
function sugKpi(r){const t=[r.titulo,r.problema,r.datos.que,r.datos.cual].join(' ').toLowerCase();const s=new Set();KW.forEach(([re,ks])=>{if(re.test(t))ks.forEach(k=>s.add(k))});return[...s].filter(k=>!r.kpis.includes(k)).slice(0,8)}
function chkAcc(a){const o=[];if(!a.que)return o;if(/concientizar|sensibilizar|reforzar|estar pendiente|tener (m[aá]s )?cuidado|hacer seguimiento$|recordar/i.test(a.que+' '+a.como))o.push('Acción poco verificable: di qué se entrega (OPL, check, rutina, tablero) y cómo se comprueba.');if(!a.quien)o.push('Falta responsable (una persona, no un área).');if(!a.plazo)o.push('Falta fecha límite.');return o}

/* ---------- IA (opcional) ---------- */
async function ia(tarea,texto,key){
  if(!AI_ENDPOINT)return toast('La IA aún no está conectada. Las guías y sugerencias automáticas siguen funcionando.');
  if(!texto.trim())return toast('Escribe primero algo para que la IA lo revise.');
  iaOut[key]={t:'Pensando… (puede tardar hasta un minuto)',tarea,wait:true};paintIA();
  const falla='La IA está ocupada o llegó al límite gratuito de Google. Intenta de nuevo en un minuto; las guías y sugerencias automáticas siguen funcionando.';
  try{const c=new AbortController(),tm=setTimeout(()=>c.abort(),70000);
    const r=await fetch(AI_ENDPOINT,{signal:c.signal,method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tarea,texto,contexto:{herramienta:TOOLS[cur.tipo].n,problema:cur.problema,kpis:cur.kpis,sector:cur.sector}})});
    clearTimeout(tm);const j=await r.json();
    iaOut[key]=j.ok&&j.texto?{t:j.texto,tarea,ok:true}:{t:falla,tarea,retry:[tarea,texto]};
    if(!j.ok)console.warn('IA:',j.detalle||j.texto)}
  catch(e){iaOut[key]={t:e.name==='AbortError'?'La IA tardó demasiado en responder. Intenta de nuevo.':'No se pudo conectar con la IA. Revisa tu conexión.',tarea,retry:[tarea,texto]}}
  paintIA()}
function paintIA(){document.querySelectorAll('[data-ia]').forEach(el=>{const o=iaOut[el.dataset.ia];el.innerHTML=o?`<div class="iabox"><b>Sugerencia IA</b>\n${esc(o.t)}<div class="noprint" style="margin-top:8px">${o.ok&&o.tarea==='redaccion'?`<button class="btn sm" data-act="iaUsar" data-k="${el.dataset.ia}">Usar este texto</button> `:''}${o.retry?`<button class="btn sm" data-act="iaRetry" data-k="${el.dataset.ia}">Reintentar</button> `:''}<button class="ghost sm" data-act="iaNo" data-k="${el.dataset.ia}">Cerrar</button></div></div>`:''})}

function vEditor(){const t=TOOLS[cur.tipo],ra=cur.tipo==='ra';
  return dl()+`<div class="top noprint"><button class="ghost" data-go="lista">← Volver</button><h1 style="margin:0">${t.n}</h1>${badge(estR(cur))}<div class="sp"></div><span id="estadoG" class="tip" style="margin:0">${esc(estadoTxt||'Se guarda automáticamente mientras escribes')}</span><button class="ghost" data-act="imprimir">Imprimir / PDF</button><button class="ghost" data-act="borrar">Eliminar</button><button class="btn" data-act="guardar">Guardar ahora</button></div>
  <div class="card"><h2>Identificación</h2><div class="grid g4">${fld(ra?'Anormalidad':'Título',inp('titulo',ra?'Ej. Rechazos':'Ej. Pedidos rechazados semana 4'))}${fld('Sede',sel('sede',SEDES))}${fld('Sector',sel('sector',SECTORES,'Selecciona…'))}${fld('Fecha',inp('fecha','','date'))}</div>${ra?secRA1():''}
  <p class="tip">Creado por ${esc(cur.creadoPor)} el ${fcorta(cur.creadoEn.slice(0,10))} · Última actualización: ${esc(cur.actualizadoPor)}</p></div>
  <div class="card"><h2>Problema</h2>${ta('problema','Ej. Rechazo de 4,2% vs meta 2,5% del 13 al 18 de octubre en las rutas de Yopal, 310 cajas devueltas')}
  <div class="noprint" style="margin-top:8px"><button class="ghost sm" data-act="iaProb">✦ Mejorar redacción con IA</button></div><div data-ia="prob"></div><div data-as="prob"></div>${ra?secRA5W():''}</div>
  <div class="card"><h2>KPI / PI impactado</h2><div class="chips">${cur.kpis.map((k,i)=>`<span class="chip">${esc(k)}<button class="x noprint" data-act="delK" data-i="${i}">×</button></span>`).join('')||'<span class="tip" style="margin:0">Ninguno seleccionado.</span>'}</div>
  <input id="kin" list="dlk" class="noprint" placeholder="Busca un KPI y presiona Enter…" style="max-width:380px"><div data-as="kpi"></div></div>
  ${ra?secRA2():''}${cur.tipo==='ish'?secIsh():secWhy()}${secAcc()}${ra?`<div class="card"><div class="grid g2">${fld('Analizó',inp('datos.analizo','Nombre')).replace('<input','<input list="dlp"')}${fld('Supervisor / responsable del área',inp('datos.responsable','Nombre')).replace('<input','<input list="dlp"')}</div></div>`:''}${secSeg()}`}

// Refresca las ayudas sin redibujar el formulario
function asist(){const A=k=>app.querySelector(`[data-as="${k}"]`);let e;
  if(e=A('prob')){const c=chkProblema(cur.problema),ok=c.filter(x=>x[0]).length;e.innerHTML=`<div class="assist"><b>Guía de redacción · ${ok}/${c.length}</b><ul>${c.map(([y,l])=>`<li class="${y?'y':'n'}">${y?'✓':'○'} ${l}</li>`).join('')}</ul></div>`}
  if(e=A('kpi')){const s=sugKpi(cur);e.innerHTML=s.length?`<div class="assist noprint"><b>KPIs sugeridos según lo que escribiste</b> (toca para agregar)<div class="chips">${s.map(k=>`<span class="chip sug" data-act="addK" data-k="${esc(k)}">+ ${esc(k)}</span>`).join('')}</div></div>`:(cur.kpis.length?'':'<p class="tip">Escribe el problema y aquí aparecerán sugerencias de KPI.</p>')}
  (cur.datos.porques||[]).forEach((c,i)=>{if(e=A('why'+i)){const w=chkWhy(c),l=lectura(c,cur.problema);e.innerHTML=(w.length||l)?`<div class="assist">${w.map(x=>`<div class="warnl">⚠ ${x}</div>`).join('')}${l?`<div style="margin-top:4px"><b>Prueba de lógica (léelo al revés):</b> ${l}<br><span style="color:var(--mut)">Si alguna flecha no tiene sentido, ese porqué está mal encadenado.</span></div>`:''}</div>`:''}});
  if(e=A('est')){const s=cur.datos.est,o=[];if(s.disp==='No')o.push('No hay estándar: incluye una acción para crear el SOP/OPL.');if(s.disp==='Sí'&&s.impl==='No')o.push('El estándar existe pero no se cumple: revisa rutina de verificación y entrenamiento.');if(s.rev==='Sí')o.push('Agrega una acción de "Correcciones al diseño" para actualizar el estándar.');if(s.entr==='Sí')o.push('Agrega una acción de "Capacitaciones" y actualiza la matriz de habilidades.');if(s.rep==='Sí')o.push('Anormalidad repetitiva: las acciones anteriores no atacaron la causa raíz; revisa el análisis previo.');e.innerHTML=o.length?`<div class="assist">${o.map(x=>`<div>→ ${x}</div>`).join('')}</div>`:''}
  cur.acciones.forEach((a,i)=>{if(e=A('acc'+i)){const w=chkAcc(a);e.innerHTML=w.length?`<div class="assist">${w.map(x=>`<div class="warnl">⚠ ${x}</div>`).join('')}</div>`:''}});
  if(e=$('#fish'))e.innerHTML=fish()}

/* ---------- acciones ---------- */
/* ---------- guardado (manual y automático) ---------- */
let dirty=false,autoT=null,estadoTxt='';
async function persist(silencio){
  const nuevoR=!records.some(r=>r.id===cur.id);cur.actualizadoPor=user.nombre;cur.actualizadoEn=new Date().toISOString();
  const u=cur.seguimiento[cur.seguimiento.length-1];
  if(nuevoR)cur.seguimiento.push({fecha:cur.actualizadoEn,autor:user.nombre,tipo:'sis',nota:'Creó la herramienta'});
  else if(!silencio&&!(u&&u.tipo==='sis'&&u.autor===user.nombre&&u.fecha.slice(0,10)===hoy()))cur.seguimiento.push({fecha:cur.actualizadoEn,autor:user.nombre,tipo:'sis',nota:'Actualizó la herramienta'});
  await Store.save(cur)}
function estadoG(t){estadoTxt=t;const e=$('#estadoG');if(e)e.textContent=t}
// Se llama en cada cambio: copia inmediata en este equipo + guardado en la nube a los 1,5 s de dejar de escribir
function marcar(){if(view!=='editor'||!cur)return;dirty=true;LS.set('hg_borrador',cur);estadoG('Cambios sin guardar…');clearTimeout(autoT);autoT=setTimeout(autoGuardar,1500)}
async function autoGuardar(){clearTimeout(autoT);if(!dirty||!cur)return;
  if(!cur.titulo.trim()){estadoG('Borrador guardado en este equipo · ponle título para guardarlo en la nube');return}
  dirty=false;estadoG('Guardando…');
  try{await persist(false);LS.set('hg_borrador',null);estadoG('✓ Guardado automáticamente '+new Date().toTimeString().slice(0,5))}
  catch(e){dirty=true;estadoG('⚠ Sin conexión, reintentando… (tus cambios están en este equipo)');autoT=setTimeout(autoGuardar,5000)}}
async function guardar(silencio){
  if(!cur.titulo.trim())return toast('Ponle un título antes de guardar.');
  clearTimeout(autoT);dirty=false;
  try{await persist(silencio);LS.set('hg_borrador',null);estadoTxt='✓ Guardado '+new Date().toTimeString().slice(0,5);toast('Guardado ✓')}catch(e){dirty=true;toast('No se pudo guardar: '+e.message)}render()}
const ACT={
  entrar(){const n=$('#ln').value.trim();if(!n)return toast('Escribe tu nombre.');user={nombre:n,sede:$('#ls').value};LS.set('hg_user',user);Store.persona(n);render()},
  nuevo(d){cur=nuevo(d.t);iaOut={};estadoTxt='';dirty=false;view='editor';render();scrollTo(0,0)},
  abrir(d){const r=records.find(x=>x.id===d.id);if(!r)return;const b=LS.get('hg_borrador',null);cur=JSON.parse(JSON.stringify(b&&b.id===r.id?b:r));iaOut={};estadoTxt=b&&b.id===r.id?'Se recuperaron cambios sin guardar':'';dirty=false;view='editor';render();scrollTo(0,0);if(b&&b.id===r.id)marcar()},
  recuperar(){const b=LS.get('hg_borrador',null);if(!b)return;cur=b;iaOut={};estadoTxt='Borrador recuperado';view='editor';render();scrollTo(0,0);marcar()},
  descartar(){if(!$('#confD')){const x=app.querySelector('[data-act=descartar]');x.textContent='¿Seguro? Se pierden esos cambios. Toca otra vez';x.id='confD';return}LS.set('hg_borrador',null);render()},
  guardar(){guardar()},imprimir(){print()},
  async borrar(){if(!records.some(r=>r.id===cur.id)){view='lista';return render()}if(!$('#conf')){const b=app.querySelector('[data-act=borrar]');b.textContent='¿Seguro? Toca otra vez';b.id='conf';return}await Store.del(cur.id);clearTimeout(autoT);dirty=false;LS.set('hg_borrador',null);view='lista';render()},
  setv(d){set(cur,d.p,get(cur,d.p)===d.v?'':d.v);render()},
  addWhy(){cur.datos.porques.push({w:['','','','',''],raiz:''});render()},delWhy(d){cur.datos.porques.splice(+d.i,1);render()},
  addC(d){cur.datos.ish[d.k].push({t:''});render()},delC(d){const a=cur.datos.ish[d.k];a.splice(+d.i,1);if(!a.length)a.push({t:''});render()},
  addS(){cur.datos.sintomas.push({punto:'',res:'',accion:''});render()},delS(d){cur.datos.sintomas.splice(+d.i,1);render()},
  addA(){cur.acciones.push({id:uid(),cat:CATS[0],que:'',como:'',quien:'',plazo:'',status:'Sin iniciar'});render()},delA(d){cur.acciones.splice(+d.i,1);render()},
  addK(d){if(!cur.kpis.includes(d.k))cur.kpis.push(d.k);render()},delK(d){cur.kpis.splice(+d.i,1);render()},
  armar(){const x=cur.datos,p=[x.que,x.cual&&'('+x.cual+')',x.donde&&'en '+x.donde,x.cuando&&'· '+x.cuando,x.quien&&'· involucra a '+x.quien].filter(Boolean).join(' ');if(!p)return toast('Responde primero las 5 preguntas.');cur.problema=p;render()},
  async nota(){const n=$('#nota').value.trim();if(!n)return toast('Escribe el avance.');cur.seguimiento.push({fecha:new Date().toISOString(),autor:user.nombre,tipo:'nota',nota:n});await guardar(true)},
  mes(d){calM=+d.n?new Date(calM.getFullYear(),calM.getMonth()+ +d.n,1):new Date();render()},
  iaProb(){ia('redaccion',cur.problema,'prob')},
  iaWhy(){ia('porques',cur.datos.porques.map((c,i)=>`Cadena ${i+1}: `+c.w.filter(Boolean).map((w,j)=>`${j+1}) ${w}`).join(' | ')+' | Causa raíz: '+c.raiz).join('\n'),'why')},
  iaIsh(){ia('causas',cur.problema||cur.titulo,'ish')},
  iaRetry(d){const o=iaOut[d.k];if(o&&o.retry)ia(o.retry[0],o.retry[1],d.k)},
  iaUsar(d){cur.problema=iaOut[d.k].t;delete iaOut[d.k];render()},iaNo(d){delete iaOut[d.k];paintIA()},
  async demo(){const r=nuevo('ra');Object.assign(r,{titulo:'Rechazos',sede:'Yopal',sector:'Distribución',fecha:hoy(),problema:'Desviación de rechazo del 13 al 18 de octubre: 4,1% vs meta 2,5% en rutas de Yopal',kpis:['OTIF','In Full','Rechazo','On Time']});
    Object.assign(r.datos,{clase:'Repetitivo',como:'Reunión diaria de logística',que:'Desviación de rechazo',cuando:'13 al 18 de octubre',donde:'Rutas Yopal',quien:'Equipo de líderes',cual:'Rechazos',sintomas:[{punto:'Clientes manifiestan que cancelaron el pedido desde la app',res:'OK',accion:'Llamada de validación'},{punto:'Clientes no cuentan con el envase',res:'OK',accion:'Aviso a ventas'}]});
    r.datos.porques=[{w:['Clientes no recibieron el pedido','No tenían dinero ni envase al momento de la entrega','No sabían qué día llegaba el pedido','El vendedor no confirma fecha de entrega al tomar el pedido','No existe paso de confirmación en la rutina de venta'],raiz:'La rutina de toma de pedido no incluye confirmar fecha, valor y envase con el cliente'}];
    const p=n=>iso(new Date(Date.now()+n*864e5));r.acciones=[{id:uid(),cat:CATS[0],que:'Llamadas aleatorias a clientes rechazados del día D-1',como:'Servicio al cliente llama 10 clientes diarios y registra motivo',quien:'Servicio al cliente',plazo:p(3),status:'En curso'},{id:uid(),cat:CATS[2],que:'OPL de confirmación de pedido',como:'Crear OPL y entrenar a fuerza de ventas',quien:'',plazo:p(-2),status:'Sin iniciar'}];
    r.seguimiento=[{fecha:new Date().toISOString(),autor:user.nombre,tipo:'sis',nota:'Creó la herramienta (ejemplo)'}];await Store.save(r);render()}
};
const EDITA=new Set(['setv','addWhy','delWhy','addC','delC','addS','delS','addA','delA','addK','delK','armar','iaUsar']);
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){if(view==='editor')autoGuardar();view=g.dataset.go;return render()}const a=e.target.closest('[data-act]');if(a&&ACT[a.dataset.act]){const n=a.dataset.act;ACT[n](a.dataset);if(view==='editor'&&EDITA.has(n))marcar()}});
window.addEventListener('beforeunload',e=>{if(view==='editor'&&dirty){autoGuardar();e.preventDefault();e.returnValue=''}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&view==='editor')autoGuardar()});
app.addEventListener('input',e=>{const t=e.target;if(t.dataset.p){set(cur,t.dataset.p,t.value);if(t.tagName==='TEXTAREA')grow(t);asist();marcar()}else if(t.dataset.f==='q'){filtro.q=t.value;const p=t.selectionStart;render();const n=app.querySelector('[data-f=q]');n.focus();n.setSelectionRange(p,p)}else if(t.id==='nota')grow(t)});
app.addEventListener('change',e=>{const t=e.target;if(t.dataset.f&&t.dataset.f!=='q'){filtro[t.dataset.f]=t.value;render()}else if(t.id==='kin'){const k=KPIS.find(x=>x.toLowerCase()===t.value.trim().toLowerCase());if(k){ACT.addK({k});marcar()}else if(t.value.trim())toast('Escoge un KPI de la lista.')}else if(t.dataset.p&&(t.tagName==='SELECT'||t.type==='date')&&t.dataset.p.startsWith('acciones'))render()});
$('#tema').onclick=()=>{const d=document.documentElement,n=d.dataset.theme==='dark'?'light':'dark';d.dataset.theme=n;LS.set('hg_tema',n)};
$('#quien').onclick=()=>{const u=user;user=null;render();if(u)$('#ln').value=u.nombre};
document.documentElement.dataset.theme=LS.get('hg_tema','light');
Store.init();render();
</script>
</body>
