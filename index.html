<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b2a6b">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/bavaria.png">
<title>Herramientas de Gestión · Gerencia Llanos</title>
<style>
:root{--bg:#f2f5fb;--card:#fff;--ink:#0f1b36;--mut:#5d6b86;--line:#dfe5f1;--acc:#1b4fd1;--btn:#1b4fd1;--navy:#0b2a6b;--gold:#f2b705;--accbg:#e9f0ff;--goldbg:#fff6d6;--ok:#1e9e5a;--warn:#e8820c;--bad:#e11d2a;--idle:#8a94a8;--sh:0 1px 2px rgba(15,27,54,.06),0 4px 14px rgba(15,27,54,.05);--r:14px}
[data-theme=dark]{--bg:#0a1226;--card:#111c38;--ink:#e9eefc;--mut:#9aa8c6;--line:#22305a;--acc:#7aa0ff;--btn:#2f63e6;--navy:#081b47;--gold:#f6cc3c;--accbg:#172650;--goldbg:#2a2610;--ok:#3cc47d;--warn:#f39a33;--bad:#ff5a64;--idle:#7d89a3;--sh:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
img{display:block}
/* encabezado */
.hdr{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:8px 18px;color:#fff;background:linear-gradient(115deg,var(--navy) 0%,#1442b8 60%,#1b4fd1 100%);box-shadow:0 2px 10px rgba(11,42,107,.25)}
.hdr::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:3px;background:linear-gradient(90deg,#e0a43a,var(--gold) 50%,#f6d21a)}
.hdr .logo{height:46px;width:auto;filter:drop-shadow(0 1px 2px rgba(0,0,0,.3))}
.brand{font-weight:800;letter-spacing:.2px;font-size:17px;line-height:1.15}.brand small{display:block;font-weight:500;opacity:.8;font-size:12px}
.topnav{display:flex;gap:4px;margin-left:14px}
.topnav button{background:none;border:0;color:#fff;opacity:.85;padding:8px 14px;border-radius:10px;cursor:pointer;font:inherit;font-weight:600}
.topnav button:hover{opacity:1;background:rgba(255,255,255,.1)}.topnav button.on{opacity:1;background:rgba(255,255,255,.16);box-shadow:inset 0 -3px 0 var(--gold)}
.sp{flex:1}
.pill{font-size:12px;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.14);white-space:nowrap}
.icon{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:10px;border:0;background:rgba(255,255,255,.12);color:#fff;cursor:pointer}
.icon svg,.tab svg,.btn svg,.ghost svg{width:20px;height:20px;flex:none}
.userchip{display:inline-flex;align-items:center;gap:8px;border:0;background:rgba(255,255,255,.12);color:#fff;border-radius:99px;padding:4px 12px 4px 4px;cursor:pointer;font:inherit;font-size:13px;max-width:220px}
.userchip i{width:30px;height:30px;border-radius:50%;background:var(--gold);color:var(--navy);font-style:normal;font-weight:800;display:inline-flex;align-items:center;justify-content:center;flex:none}
.userchip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* barra inferior móvil */
.tabbar{display:none}
main{max-width:1180px;margin:0 auto;padding:22px 16px 90px}
h1{font-size:22px;margin:4px 0 14px}h2{font-size:16px;margin:0 0 10px}h3{font-size:14px;margin:14px 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.card h2{display:flex;align-items:center;gap:8px}.card h2::before{content:"";width:4px;height:18px;border-radius:2px;background:var(--gold)}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}
.sec{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 10px}.sec h2{margin:0;font-size:17px}.sec a{color:var(--acc);font-weight:600;cursor:pointer;font-size:14px}
/* inicio */
.hero{position:relative;overflow:hidden;display:flex;align-items:center;gap:18px;padding:20px;border-radius:20px;color:#fff;background:linear-gradient(120deg,var(--navy),#1b4fd1);box-shadow:0 8px 24px rgba(27,79,209,.25);margin-bottom:16px}
.hero .mascot{width:104px;height:104px;border-radius:50%;border:4px solid var(--gold);box-shadow:0 4px 12px rgba(0,0,0,.25);flex:none;position:relative;z-index:1;background:#e5e2df}
.hero .hi{font-size:24px;font-weight:800;line-height:1.15}.hero .sub{opacity:.9;margin-top:4px;font-size:15px}
.hero .sym{position:absolute;right:-30px;top:-30px;width:190px;opacity:.22;pointer-events:none}
.hero .bv{position:absolute;right:16px;bottom:14px;width:40px;opacity:.95;z-index:1}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:6px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh);position:relative;overflow:hidden}
.stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c,var(--acc))}
.kpiN{font-size:28px;font-weight:800;line-height:1.1}.kpiL{color:var(--mut);font-size:13px}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tool{display:flex;gap:14px;align-items:center;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh);transition:transform .12s,box-shadow .12s;text-align:left;font:inherit;color:inherit;width:100%}
.tool:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(27,79,209,.14)}.tool:active{transform:scale(.98)}
.tico{width:52px;height:52px;border-radius:14px;flex:none;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--navy),#1b4fd1);color:var(--gold)}
.tico svg{width:28px;height:28px}
.tool .tx{min-width:0}.tool b{display:block;font-size:16px;color:var(--ink)}.tool small{color:var(--mut);font-size:13px;display:block;line-height:1.35}
.tool .go{margin-left:auto;color:var(--mut);font-size:22px}
.draft{border-left:5px solid var(--warn);background:var(--goldbg)}
/* tarjetas de herramientas */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.rcard{cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:6px;transition:box-shadow .12s}
.rcard:hover{box-shadow:0 8px 20px rgba(27,79,209,.14)}.rcard:active{transform:scale(.99)}
.rtop{display:flex;align-items:center;gap:8px}.ttag{font-size:12px;font-weight:700;color:var(--acc);background:var(--accbg);padding:2px 9px;border-radius:99px}
.rcard .t{font-weight:700;font-size:16px}
.rcard .p{color:var(--mut);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kmini{display:flex;flex-wrap:wrap;gap:4px}.kmini span{font-size:11px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}
.rfoot{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--mut);margin-top:2px}
.prog{flex:1;height:6px;border-radius:99px;background:var(--line);overflow:hidden}.prog i{display:block;height:100%;background:var(--ok);border-radius:99px}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px}
.empty{text-align:center;padding:24px 16px;color:var(--mut)}.empty img{width:120px;margin:0 auto 10px;border-radius:16px}
/* formularios */
label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;min-height:42px}
textarea{resize:none;overflow:hidden}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:-1px;background:var(--card)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--btn);color:#fff;border:0;padding:10px 16px;border-radius:10px;cursor:pointer;font:inherit;font-weight:700;min-height:42px}
.btn:hover{filter:brightness(1.08)}.btn.gold{background:var(--gold);color:var(--navy)}
.ghost{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--card);border:1px solid var(--line);color:var(--ink);padding:9px 14px;border-radius:10px;cursor:pointer;font:inherit;min-height:42px}
.ghost:hover{border-color:var(--acc);color:var(--acc)}
.btn.sm,.ghost.sm{padding:6px 11px;font-size:13px;min-height:34px}
.x{background:none;border:0;color:var(--mut);cursor:pointer;font-size:18px;padding:4px 8px;min-width:34px;min-height:34px}.x:hover{color:var(--bad)}
.tip{font-size:13px;color:var(--mut);margin:5px 0 0}
.assist{background:var(--accbg);border-radius:10px;padding:10px 12px;margin-top:8px;font-size:13px}
.assist b{color:var(--acc)}.assist ul{margin:4px 0 0;padding-left:0;list-style:none}
.assist li{padding:1px 0}.assist li.y{color:var(--ok)}.assist li.n{color:var(--ink)}
.warnl{color:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:99px;background:var(--accbg);color:var(--acc);font-size:13px;border:1px solid transparent;font-weight:600}
.chip.sug{background:none;border:1px dashed var(--acc);cursor:pointer}.chip .x{font-size:14px;padding:0 2px;min-width:0;min-height:0}
.st{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;color:#fff;white-space:nowrap}
.st.Completado{background:var(--ok)}.st.En-curso{background:var(--warn)}.st.Atrasado{background:var(--bad)}.st.Sin-iniciar{background:var(--idle)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:var(--card);border:0;padding:8px 14px;cursor:pointer;color:var(--ink);font:inherit;min-height:40px}.seg button.on{background:var(--btn);color:#fff;font-weight:700}
.why{display:grid;grid-template-columns:repeat(5,1fr) 1.2fr;gap:8px;align-items:start}
.why .n{font-size:11px;font-weight:800;color:var(--acc);display:block;margin-bottom:3px}
.act{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;display:grid;grid-template-columns:1.1fr 1.6fr 1.6fr 1fr .9fr .9fr auto;gap:8px;align-items:start;background:var(--bg)}
/* editor */
.edtop{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.edtop h1{margin:0}.edbtns{display:flex;gap:8px;align-items:center}
#estadoG{font-size:13px;color:var(--mut)}
/* calendario */
.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dh{font-size:12px;color:var(--mut);text-align:center;font-weight:700;padding:4px}
.day{min-height:96px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:5px;font-size:12px;overflow:hidden;cursor:pointer}
.day.out{opacity:.35}.day.today{border-color:var(--gold);border-width:2px}.day.sel{outline:2px solid var(--acc);outline-offset:-1px}
.day .d{font-weight:800;color:var(--mut)}
.dots{display:none;gap:3px;flex-wrap:wrap;margin-top:4px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--idle)}
.dots i.c{background:var(--acc)}.dots i.Completado{background:var(--ok)}.dots i.En-curso{background:var(--warn)}.dots i.Atrasado{background:var(--bad)}.dots i.s{background:var(--gold)}
.ev{display:block;margin-top:2px;padding:1px 6px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;color:#fff;background:var(--idle)}
.ev.c{background:var(--acc)}.ev.Completado{background:var(--ok)}.ev.En-curso{background:var(--warn)}.ev.Atrasado{background:var(--bad)}.ev.s{background:var(--goldbg);color:var(--ink);border:1px solid var(--gold)}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 10px;font-size:12px;color:var(--mut)}.legend span{display:inline-flex;align-items:center;gap:5px}.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
.devs .rcard{flex-direction:row;align-items:center;gap:10px}.devs .rcard i{width:10px;height:10px;border-radius:50%;flex:none}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:12px}.tl div{margin-bottom:8px;font-size:14px}.tl small{color:var(--mut)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 18px;border-radius:12px;z-index:99;max-width:90vw;box-shadow:0 6px 18px rgba(0,0,0,.25);border-left:4px solid var(--gold)}
.modal{position:fixed;inset:0;background:linear-gradient(150deg,var(--navy),#1b4fd1);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;overflow:auto}
.modal .card{max-width:400px;width:100%;text-align:center;border:0;box-shadow:0 20px 50px rgba(0,0,0,.35);padding:22px}
.modal .card .grid{text-align:left}.modal .lg{width:150px;margin:0 auto 6px}.modal h2{justify-content:center}.modal h2::before{display:none}
.sheet{position:fixed;inset:0;z-index:60;background:rgba(5,12,30,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet .in{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px rgba(0,0,0,.2)}
.sheet .grab{width:44px;height:5px;border-radius:99px;background:var(--line);margin:4px auto 12px}
.sheet .tool{margin-bottom:10px;box-shadow:none}
svg text{fill:var(--ink);font-family:inherit}
.iabox{white-space:pre-wrap;border:1px dashed var(--acc);border-radius:10px;padding:10px;margin-top:8px;font-size:14px;background:var(--card)}
@media(max-width:1000px){.topnav button{padding:8px 10px}.pill{display:none}}
@media(max-width:860px){.g2,.g3,.g4,.g5,.why,.act{grid-template-columns:1fr}.tools{grid-template-columns:1fr}}
@media(max-width:760px){
  body{font-size:15px}
  input,select,textarea{font-size:16px}
  .hdr{padding:8px 12px;gap:10px}.hdr .logo{height:38px}.brand{font-size:15px}.brand small{font-size:11px}
  .topnav,.pill{display:none}.userchip{padding:3px}.userchip span{display:none}
  main{padding:14px 12px calc(96px + env(safe-area-inset-bottom))}
  h1{font-size:20px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(15,27,54,.08)}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;color:var(--mut);font:inherit;font-size:11px;font-weight:600;padding:6px 0;cursor:pointer;border-radius:10px}
  .tab svg{width:24px;height:24px}.tab.on{color:var(--acc)}.tab.on svg{transform:scale(1.08)}
  .tab.fab{color:var(--navy)}.tab.fab span.c{width:52px;height:52px;margin-top:-26px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(242,183,5,.5);border:4px solid var(--card)}
  .tab.fab svg{width:26px;height:26px}.tab.fab>span:last-child{color:var(--mut)}
  .hide-m{display:none}
  body.editing .tabbar{display:none}
  .hero{padding:16px;gap:14px;border-radius:18px}.hero .mascot{width:80px;height:80px}.hero .hi{font-size:20px}.hero .sub{font-size:14px}.hero .sym{width:150px}.hero .bv{width:30px;right:12px;bottom:10px}
  .stats{grid-template-columns:repeat(2,1fr);gap:10px}.stat{padding:12px 14px}.kpiN{font-size:24px}
  .tools,.rgrid{grid-template-columns:1fr}
  .filters{grid-template-columns:1fr 1fr 1fr}.filters input{grid-column:1/-1}
  .card{padding:14px;border-radius:12px}
  .edtop{position:sticky;top:57px;z-index:20;background:var(--bg);margin:-14px -12px 12px;padding:10px 12px;border-bottom:1px solid var(--line)}
  .edtop h1{font-size:17px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .edtop #estadoG{flex-basis:100%;order:5;font-size:12px}
  .edbtns{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(15,27,54,.1)}
  .edbtns .btn{flex:1}.edbtns .ghost .lbl{display:none}
  .day{min-height:54px;padding:4px;text-align:center}.day .ev{display:none}.dots{display:flex;justify-content:center}
  .cal{gap:3px}.top h1{font-size:19px}
  .seg button{padding:8px 16px}
}
@media print{.hdr,.tabbar,.noprint,.assist,.tip,.x,.edbtns,#estadoG{display:none!important}body{background:#fff}.card{box-shadow:none;break-inside:avoid}main{padding:0;max-width:none}input,select,textarea{border:0;background:none;padding:2px 0}}
</style>
</head>
<body>
<header class="hdr">
  <img class="logo" src="img/logo-llanos.webp" alt="Gerencia Llanos">
  <div class="brand">Herramientas de Gestión<small>Gerencia Llanos<span class="hide-m"> · CD Villavicencio / Yopal</span></small></div>
  <nav id="nav" class="topnav"></nav><div class="sp"></div>

</header>
<main id="app"></main>
<nav id="tabbar" class="tabbar"></nav>
<div id="sheet"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>

const AI_ENDPOINT = "https://herramientas-ia.mateopadillita0529.workers.dev/";
const SEDES = ["Villavicencio","Yopal"];

/* =================================================================== */

const TOOLS = {
  '5p':{n:'5 Porqués',d:'Llega a la causa raíz preguntando por qué, paso a paso.'},
  'ra':{n:'Reporte de Anormalidad',d:'Identificación, síntoma, estandarización, causa raíz y plan con seguimiento.'},

function chkProblema(t){t=t||'';return[
 [t.trim().length>=40,'Describe el hecho con detalle suficiente'],
 [/\d/.test(t),'Incluye un dato medible: %, cajas, pedidos, rutas, pesos'],
 [/\d{1,2}[\/\-]\d{1,2}|semana|enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|octubre|noviembre|diciembre|ayer|hoy|turno|del d[ií]a|del \d/i.test(t),'Di cuándo ocurrió (fecha, semana o turno)'],
 [/\bvs\b|meta|objetivo|target|frente a|est[aá]ndar|l[ií]mite/i.test(t),'Compara contra la meta o el estándar (ej. "4,2% vs meta 2,5%")'],
 [!!t&&!/falta de|por culpa|descuido|porque|debido a/i.test(t),'Describe el síntoma, no la causa ni el culpable (evita "falta de", "porque", "por culpa")']]}
function chkWhy(c){const w=c.w.map(x=>x.trim()),out=[],n=w.filter(Boolean).length,all=[...w,c.raiz].join(' ');
  if(w.some((x,i)=>x&&w.slice(0,i).some(y=>!y)))out.push('Hay un porqué vacío en medio de la cadena: cada respuesta debe salir de la anterior.');
  if(w.some((x,i)=>x&&w.indexOf(x)!==i))out.push('Dos porqués dicen lo mismo: avanza un nivel más profundo.');
  if(/descuido|error humano|no quiso|culpa|irresponsab|pereza|falta de compromiso|no le import|se le olvid/i.test(all))out.push('Evita culpar a la persona. Pregunta: ¿qué del proceso, el estándar o el entrenamiento permitió que pasara?');
  if(/^\s*falta de|no hay /i.test(c.raiz))out.push('"Falta de…" suele ser una solución disfrazada. Pregunta una vez más: ¿por qué falta?');
  if(/clima|lluvia|tr[aá]fico|tranc[oó]n|orden p[uú]blico/i.test(c.raiz))out.push('La causa raíz parece estar fuera de tu control. Sigue hasta algo que el CD sí pueda cambiar.');
  if(c.raiz.trim()&&n<3)out.push('Con menos de 3 porqués normalmente se llega al síntoma, no a la causa raíz.');
  return out}
function lectura(c,prob){const w=c.w.filter(x=>x.trim());if(w.length<2)return'';const ch=[...w].reverse();return (c.raiz?esc(c.raiz)+' → por lo tanto → ':'')+ch.map(esc).join(' → por lo tanto → ')+(prob?' → por lo tanto → <b>'+esc(prob.slice(0,90))+'</b>':'')}
function sugKpi(r){const t=[r.titulo,r.problema,r.datos.que,r.datos.cual].join(' ').toLowerCase();const s=new Set();KW.forEach(([re,ks])=>{if(re.test(t))ks.forEach(k=>s.add(k))});return[...s].filter(k=>!r.kpis.includes(k)).slice(0,8)}
function chkAcc(a){const o=[];if(!a.que)return o;if(/concientizar|sensibilizar|reforzar|estar pendiente|tener (m[aá]s )?cuidado|hacer seguimiento$|recordar/i.test(a.que+' '+a.como))o.push('Acción poco verificable: di qué se entrega (OPL, check, rutina, tablero) y cómo se comprueba.');if(!a.quien)o.push('Falta responsable (una persona, no un área).');if(!a.plazo)o.push('Falta fecha límite.');return o}

/* ---------- IA (opcional) ---------- */
async function ia(tarea,texto,key){
  if(!AI_ENDPOINT)return toast('La IA aún no está conectada. Las guías y sugerencias automáticas siguen funcionando.');
  if(!texto.trim())return toast('Escribe primero algo para que la IA lo revise.');
  iaOut[key]={t:'Pensando… (puede tardar hasta un minuto)',tarea,wait:true};paintIA();
  const falla='La IA está ocupada o llegó al límite gratuito de Google. Intenta de nuevo en un minuto; las guías y sugerencias automáticas siguen funcionando.';
  try{const c=new AbortController(),tm=setTimeout(()=>c.abort(),70000);
    const r=await fetch(AI_ENDPOINT,{signal:c.signal,method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tarea,texto,contexto:{herramienta:TOOLS[cur.tipo].n,problema:cur.problema,kpis:cur.kpis,sector:cur.sector}})});
    clearTimeout(tm);const j=await r.json();
    iaOut[key]=j.ok&&j.texto?{t:j.texto,tarea,ok:true}:{t:falla,tarea,retry:[tarea,texto]};
    if(!j.ok)console.warn('IA:',j.detalle||j.texto)}
  catch(e){iaOut[key]={t:e.name==='AbortError'?'La IA tardó demasiado en responder. Intenta de nuevo.':'No se pudo conectar con la IA. Revisa tu conexión.',tarea,retry:[tarea,texto]}}
  paintIA()}
function paintIA(){document.querySelectorAll('[data-ia]').forEach(el=>{const o=iaOut[el.dataset.ia];el.innerHTML=o?`<div class="iabox"><b>Sugerencia IA</b>\n${esc(o.t)}<div class="noprint" style="margin-top:8px">${o.ok&&o.tarea==='redaccion'?`<button class="btn sm" data-act="iaUsar" data-k="${el.dataset.ia}">Usar este texto</button> `:''}${o.retry?`<button class="btn sm" data-act="iaRetry" data-k="${el.dataset.ia}">Reintentar</button> `:''}<button class="ghost sm" data-act="iaNo" data-k="${el.dataset.ia}">Cerrar</button></div></div>`:''})}

  if(e=A('kpi')){const s=sugKpi(cur);e.innerHTML=s.length?`<div class="assist noprint"><b>KPIs sugeridos según lo que escribiste</b> (toca para agregar)<div class="chips">${s.map(k=>`<span class="chip sug" data-act="addK" data-k="${esc(k)}">+ ${esc(k)}</span>`).join('')}</div></div>`:(cur.kpis.length?'':'<p class="tip">Escribe el problema y aquí aparecerán sugerencias de KPI.</p>')}
  (cur.datos.porques||[]).forEach((c,i)=>{if(e=A('why'+i)){const w=chkWhy(c),l=lectura(c,cur.problema);e.innerHTML=(w.length||l)?`<div class="assist">${w.map(x=>`<div class="warnl">⚠ ${x}</div>`).join('')}${l?`<div style="margin-top:4px"><b>Prueba de lógica (léelo al revés):</b> ${l}<br><span style="color:var(--mut)">Si alguna flecha no tiene sentido, ese porqué está mal encadenado.</span></div>`:''}</div>`:''}});
  if(e=A('est')){const s=cur.datos.est,o=[];if(s.disp==='No')o.push('No hay estándar: incluye una acción para crear el SOP/OPL.');if(s.disp==='Sí'&&s.impl==='No')o.push('El estándar existe pero no se cumple: revisa rutina de verificación y entrenamiento.');if(s.rev==='Sí')o.push('Agrega una acción de "Correcciones al diseño" para actualizar el estándar.');if(s.entr==='Sí')o.push('Agrega una acción de "Capacitaciones" y actualiza la matriz de habilidades.');if(s.rep==='Sí')o.push('Anormalidad repetitiva: las acciones anteriores no atacaron la causa raíz; revisa el análisis previo.');e.innerHTML=o.length?`<div class="assist">${o.map(x=>`<div>→ ${x}</div>`).join('')}</div>`:''}
  cur.acciones.forEach((a,i)=>{if(e=A('acc'+i)){const w=chkAcc(a);e.innerHTML=w.length?`<div class="assist">${w.map(x=>`<div class="warnl">⚠ ${x}</div>`).join('')}</div>`:''}});
  if(e=$('#fish'))e.innerHTML=fish()}

/* ---------- acciones ---------- */
/* ---------- guardado (manual y automático) ---------- */
let dirty=false,autoT=null,estadoTxt='';
async function persist(silencio){
  const nuevoR=!records.some(r=>r.id===cur.id);cur.actualizadoPor=user.nombre;cur.actualizadoEn=new Date().toISOString();
  const u=cur.seguimiento[cur.seguimiento.length-1];
  if(nuevoR)cur.seguimiento.push({fecha:cur.actualizadoEn,autor:user.nombre,tipo:'sis',nota:'Creó la herramienta'});
  else if(!silencio&&!(u&&u.tipo==='sis'&&u.autor===user.nombre&&u.fecha.slice(0,10)===hoy()))cur.seguimiento.push({fecha:cur.actualizadoEn,autor:user.nombre,tipo:'sis',nota:'Actualizó la herramienta'});
  await Store.save(cur)}
function estadoG(t){estadoTxt=t;const e=$('#estadoG');if(e)e.textContent=t}
// Se llama en cada cambio: copia inmediata en este equipo + guardado en la nube a los 1,5 s de dejar de escribir
function marcar(){if(view!=='editor'||!cur)return;dirty=true;LS.set('hg_borrador',cur);estadoG('Cambios sin guardar…');clearTimeout(autoT);autoT=setTimeout(autoGuardar,1500)}
async function autoGuardar(){clearTimeout(autoT);if(!dirty||!cur)return;
  if(!cur.titulo.trim()){estadoG('Borrador guardado en este equipo · ponle título para guardarlo en la nube');return}
  dirty=false;estadoG('Guardando…');
  try{await persist(false);LS.set('hg_borrador',null);estadoG('✓ Guardado automáticamente '+new Date().toTimeString().slice(0,5))}
  catch(e){dirty=true;estadoG('⚠ Sin conexión, reintentando… (tus cambios están en este equipo)');autoT=setTimeout(autoGuardar,5000)}}
async function guardar(silencio){
  if(!cur.titulo.trim())return toast('Ponle un título antes de guardar.');
  clearTimeout(autoT);dirty=false;
  try{await persist(silencio);LS.set('hg_borrador',null);estadoTxt='✓ Guardado '+new Date().toTimeString().slice(0,5);toast('Guardado ✓')}catch(e){dirty=true;toast('No se pudo guardar: '+e.message)}render()}
const ACT={
  entrar(){const n=$('#ln').value.trim();if(!n)return toast('Escribe tu nombre.');user={nombre:n,sede:$('#ls').value};LS.set('hg_user',user);Store.persona(n);render()},
  nuevo(d){$('#sheet').innerHTML='';cur=nuevo(d.t);iaOut={};estadoTxt='';dirty=false;view='editor';render();scrollTo(0,0)},
  abrir(d){const r=records.find(x=>x.id===d.id);if(!r)return;const b=LS.get('hg_borrador',null);cur=JSON.parse(JSON.stringify(b&&b.id===r.id?b:r));iaOut={};estadoTxt=b&&b.id===r.id?'Se recuperaron cambios sin guardar':'';dirty=false;view='editor';render();scrollTo(0,0);if(b&&b.id===r.id)marcar()},
  sheet(){$('#sheet').innerHTML=`<div class="sheet" data-act="cerrarSheet"><div class="in" data-act="nada"><div class="grab"></div><h2 style="margin:0 0 12px">¿Qué herramienta vas a crear?</h2>${Object.entries(TOOLS).map(([k,t])=>toolBtn(k,t)).join('')}</div></div>`},
  cerrarSheet(){$('#sheet').innerHTML=''},nada(){},
  dia(d){selDia=d.k;render()},
  recuperar(){const b=LS.get('hg_borrador',null);if(!b)return;cur=b;iaOut={};estadoTxt='Borrador recuperado';view='editor';render();scrollTo(0,0);marcar()},
  descartar(){if(!$('#confD')){const x=app.querySelector('[data-act=descartar]');x.textContent='¿Seguro? Se pierden esos cambios. Toca otra vez';x.id='confD';return}LS.set('hg_borrador',null);render()},
  guardar(){guardar()},imprimir(){print()},
  async borrar(){if(!records.some(r=>r.id===cur.id)){view='lista';return render()}if(!$('#conf')){const b=app.querySelector('[data-act=borrar]');b.textContent='¿Seguro? Toca otra vez';b.id='conf';return}await Store.del(cur.id);clearTimeout(autoT);dirty=false;LS.set('hg_borrador',null);view='lista';render()},
  setv(d){set(cur,d.p,get(cur,d.p)===d.v?'':d.v);render()},
  addWhy(){cur.datos.porques.push({w:['','','','',''],raiz:''});render()},delWhy(d){cur.datos.porques.splice(+d.i,1);render()},
  addC(d){cur.datos.ish[d.k].push({t:''});render()},delC(d){const a=cur.datos.ish[d.k];a.splice(+d.i,1);if(!a.length)a.push({t:''});render()},
  addS(){cur.datos.sintomas.push({punto:'',res:'',accion:''});render()},delS(d){cur.datos.sintomas.splice(+d.i,1);render()},
  addA(){cur.acciones.push({id:uid(),cat:CATS[0],que:'',como:'',quien:'',plazo:'',status:'Sin iniciar'});render()},delA(d){cur.acciones.splice(+d.i,1);render()},
  addK(d){if(!cur.kpis.includes(d.k))cur.kpis.push(d.k);render()},delK(d){cur.kpis.splice(+d.i,1);render()},
  armar(){const x=cur.datos,p=[x.que,x.cual&&'('+x.cual+')',x.donde&&'en '+x.donde,x.cuando&&'· '+x.cuando,x.quien&&'· involucra a '+x.quien].filter(Boolean).join(' ');if(!p)return toast('Responde primero las 5 preguntas.');cur.problema=p;render()},
  async nota(){const n=$('#nota').value.trim();if(!n)return toast('Escribe el avance.');cur.seguimiento.push({fecha:new Date().toISOString(),autor:user.nombre,tipo:'nota',nota:n});await guardar(true)},
  mes(d){calM=+d.n?new Date(calM.getFullYear(),calM.getMonth()+ +d.n,1):new Date();render()},
  iaProb(){ia('redaccion',cur.problema,'prob')},
  iaWhy(){ia('porques',cur.datos.porques.map((c,i)=>`Cadena ${i+1}: `+c.w.filter(Boolean).map((w,j)=>`${j+1}) ${w}`).join(' | ')+' | Causa raíz: '+c.raiz).join('\n'),'why')},
  iaIsh(){ia('causas',cur.problema||cur.titulo,'ish')},
  iaRetry(d){const o=iaOut[d.k];if(o&&o.retry)ia(o.retry[0],o.retry[1],d.k)},
  iaUsar(d){cur.problema=iaOut[d.k].t;delete iaOut[d.k];render()},iaNo(d){delete iaOut[d.k];paintIA()},
  async demo(){const r=nuevo('ra');Object.assign(r,{titulo:'Rechazos',sede:'Yopal',sector:'Distribución',fecha:hoy(),problema:'Desviación de rechazo del 13 al 18 de octubre: 4,1% vs meta 2,5% en rutas de Yopal',kpis:['OTIF','In Full','Rechazo','On Time']});
    Object.assign(r.datos,{clase:'Repetitivo',como:'Reunión diaria de logística',que:'Desviación de rechazo',cuando:'13 al 18 de octubre',donde:'Rutas Yopal',quien:'Equipo de líderes',cual:'Rechazos',sintomas:[{punto:'Clientes manifiestan que cancelaron el pedido desde la app',res:'OK',accion:'Llamada de validación'},{punto:'Clientes no cuentan con el envase',res:'OK',accion:'Aviso a ventas'}]});
    r.datos.porques=[{w:['Clientes no recibieron el pedido','No tenían dinero ni envase al momento de la entrega','No sabían qué día llegaba el pedido','El vendedor no confirma fecha de entrega al tomar el pedido','No existe paso de confirmación en la rutina de venta'],raiz:'La rutina de toma de pedido no incluye confirmar fecha, valor y envase con el cliente'}];
    const p=n=>iso(new Date(Date.now()+n*864e5));r.acciones=[{id:uid(),cat:CATS[0],que:'Llamadas aleatorias a clientes rechazados del día D-1',como:'Servicio al cliente llama 10 clientes diarios y registra motivo',quien:'Servicio al cliente',plazo:p(3),status:'En curso'},{id:uid(),cat:CATS[2],que:'OPL de confirmación de pedido',como:'Crear OPL y entrenar a fuerza de ventas',quien:'',plazo:p(-2),status:'Sin iniciar'}];
    r.seguimiento=[{fecha:new Date().toISOString(),autor:user.nombre,tipo:'sis',nota:'Creó la herramienta (ejemplo)'}];await Store.save(r);render()}
};
const EDITA=new Set(['setv','addWhy','delWhy','addC','delC','addS','delS','addA','delA','addK','delK','armar','iaUsar']);
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){if(view==='editor')autoGuardar();view=g.dataset.go;return render()}const a=e.target.closest('[data-act]');if(a&&ACT[a.dataset.act]){const n=a.dataset.act;ACT[n](a.dataset);if(view==='editor'&&EDITA.has(n))marcar()}});
window.addEventListener('beforeunload',e=>{if(view==='editor'&&dirty){autoGuardar();e.preventDefault();e.returnValue=''}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&view==='editor')autoGuardar()});
app.addEventListener('input',e=>{const t=e.target;if(t.dataset.p){set(cur,t.dataset.p,t.value);if(t.tagName==='TEXTAREA')grow(t);asist();marcar()}else if(t.dataset.f==='q'){filtro.q=t.value;const p=t.selectionStart;render();const n=app.querySelector('[data-f=q]');n.focus();n.setSelectionRange(p,p)}else if(t.id==='nota')grow(t)});
app.addEventListener('change',e=>{const t=e.target;if(t.dataset.f&&t.dataset.f!=='q'){filtro[t.dataset.f]=t.value;render()}else if(t.id==='kin'){const k=KPIS.find(x=>x.toLowerCase()===t.value.trim().toLowerCase());if(k){ACT.addK({k});marcar()}else if(t.value.trim())toast('Escoge un KPI de la lista.')}else if(t.dataset.p&&(t.tagName==='SELECT'||t.type==='date')&&t.dataset.p.startsWith('acciones'))render()});
$('#tema').onclick=()=>{const d=document.documentElement,n=d.dataset.theme==='dark'?'light':'dark';d.dataset.theme=n;LS.set('hg_tema',n);$('#tema').innerHTML=n==='dark'?IC.sun:IC.moon};
$('#quien').onclick=()=>{const u=user;user=null;render();if(u)$('#ln').value=u.nombre};
document.documentElement.dataset.theme=LS.get('hg_tema','light');
Store.init();render();
</script>
